[project]
name = "doc-translate"
version = "0.1.0"
description = "Office 개정본 검토와 중국어 번역 재사용 도구"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docutranslate==1.7.11",
  "python-redlines[docxodus]==2.0.0",
  "daff==1.4.2",
  "fastapi==0.163.1",
  "python-multipart==0.0.34",
  "uvicorn==0.54.0",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "lxml==6.1.3",
  "pypdfium2==5.15.2",
]

[project.scripts]
doc-translate = "app.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1", "pillow==13.0.0"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# docutranslate declares html2text but does not import it. No GPL HTML converter
# is needed for the supported Office-only workflow.
override-dependencies = ["html2text; python_version < '0'"]
